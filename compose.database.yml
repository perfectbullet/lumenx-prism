name: lumenx-prism
services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PRISM_MONGO_ROOT_USERNAME:-prism_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${PRISM_MONGO_ROOT_PASSWORD:?Set a dedicated Prism root password}
      PRISM_MONGO_APP_PASSWORD: ${PRISM_MONGO_APP_PASSWORD:?Set a dedicated Prism app password}
    ports:
      - "127.0.0.1:${PRISM_MONGO_PORT:-27019}:27017"
    volumes:
      - prism-mongodb-data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/01-prism-user.js:ro
volumes:
  prism-mongodb-data:
    name: lumenx-prism-mongodb-data
