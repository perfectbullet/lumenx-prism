<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品库 · LumenX Prism</title><link rel="stylesheet" href="/static/production.css"><link rel="stylesheet" href="/static/tool-layout.css"><link rel="stylesheet" href="/static/works.css"></head><body class="production-page"><header class="page-header"><div><div class="eyebrow">LUMENX PRISM / STORY LIBRARY</div><h1>作品库</h1></div><nav aria-label="制作工具"><a href="/tools/works">作品库</a><a href="/tools/scripts">剧本制作规划</a><a href="/tools/entities">素材提取</a><a href="/tools/images">图像制作台</a><a href="/tools/prompt-images">提示词生图</a><a href="/tools/storyboards">分镜制作台</a><a href="/tools/videos">视频制作台</a><a href="/tools/h3-ref2va-v1">h3-ref2va-v1</a><a href="/tools/merges">视频合并</a><a href="/tools/comfyui">ComfyUI 任务管理</a><a href="/tools/models">模型配置</a><a href="/docs" target="_blank" rel="noopener">接口文档</a></nav></header><main class="production-workspace"><aside><div class="panel-heading"><h2>01 原文与制作规格</h2><button id="new">新增作品</button></div><div class="panel-scroll editor-fields"><label>服务令牌<input id="token" type="password" autocomplete="off"></label><label>选择作品<select id="works"></select></label><div class="row"><button id="prev">上一页</button><button id="next">下一页</button><button id="refresh">刷新</button></div><label>作品名称<input id="title" maxlength="150" placeholder="为小说、剧本或故事起个名字"></label><label>来源类型<select id="kind"><option value="script">剧本</option><option value="novel">小说</option><option value="story">故事</option></select></label><label>导入文本文件<input id="file" type="file" accept=".txt,.md,text/plain,text/markdown"></label><p class="muted">UTF-8 文本，最多 8 万字；也可直接粘贴。原文保存后保留不变，改稿可作为新作品导入。</p><label>原始文本<textarea id="text" rows="15" maxlength="80000"></textarea></label><button id="saveWork">保存原文</button><div class="two"><label>画幅<select id="ratio"><option>16:9</option><option>9:16</option></select></label><label>指定每集时长（可选覆盖）<input id="duration" type="number" min="15" max="3600" placeholder="默认按内容估算，偏好 2～5 分钟"></label></div><label>画风要求（可留空，由 AI 建议）<textarea id="style" rows="2"></textarea></label><label>改编要求<textarea id="instructions" rows="2" placeholder="保留关键对白、目标观众、中文对白等"></textarea></label></div><div class="editor-footer"><button id="analyze" class="primary">AI 建议分集、简报与名称</button></div></aside><section class="panel"><div class="panel-heading"><h2>02 分集确认与制作入口</h2><button id="confirm">确认分集，保存制作版本</button></div><div class="production-toolbar"><label>分析记录<select id="jobs"></select></label><label>已确认分集版本<select id="editions"></select></label><p class="muted">先确认分集，再按集规划场次和提取实体。编辑已确认内容后再保存，会创建新版本，不影响旧任务。</p></div><div id="result" class="panel-scroll editor-fields"><p>选择作品或导入原文，开始制作。</p></div></section></main><div id="status" class="status" role="status">准备就绪</div><script src="/static/request-utils.js"></script><script src="/static/works.js?v=20261030-flow1"></script></body></html>
