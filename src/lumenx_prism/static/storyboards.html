<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分镜制作台 · LumenX Prism</title><link rel="stylesheet" href="/static/production.css?v=20261030-layout2"><link rel="stylesheet" href="/static/tool-layout.css?v=20261030-layout2"></head><body class="production-page storyboards-page"><header class="page-header"><div><div class="eyebrow">LUMENX PRISM / PRODUCTION LAB</div><h1>分镜制作台</h1></div><nav aria-label="制作工具"><a href="/tools/entities">实体提取</a><a href="/tools/images">图像制作台</a><a href="/tools/storyboards">分镜制作台</a><a href="/tools/videos">视频制作台</a><a href="/tools/models">模型配置</a><a href="/docs" target="_blank" rel="noopener">接口文档</a></nav></header><main data-page="storyboards" class="production-workspace"><aside class="production-editor"><div class="panel-heading"><h2>01 剧本与制作要求</h2></div><div class="panel-scroll editor-fields"><label>服务令牌<input id="token" type="password" autocomplete="off"></label><div class="row"><button id="connect">连接 / 刷新</button></div><label>已有实体提取任务<select id="entitySource"><option value="">选择任务带入剧本</option></select></label><details class="source-lookup"><summary>按任务编号载入</summary><label>任务 ID<input id="entityId"></label></details><button id="importEntity">载入剧本与实体</button><label>标题<input id="title" value="短片实验"></label><label>原始剧本<textarea id="script" rows="5"></textarea></label><details><summary>已提取的实体</summary><pre id="entities"></pre></details><label>画风<input id="style" placeholder="沿用已选图片的画风"></label><div class="two"><label>画幅<select id="ratio"><option>16:9</option><option>9:16</option></select></label><label>总时长（秒）<input id="duration" type="number" min="8" max="45" value="15"></label><label>镜头数<input id="count" type="number" min="2" max="6" value="3"></label></div><p class="muted">中文对白与环境音 · 不添加背景音乐。先确认素材，再生成文字分镜。</p><div class="subsection-heading"><h3>参考素材</h3><button id="pickImages">选择图片</button></div><div id="assets"></div></div><div class="editor-footer"><button class="primary" id="generateBoard">生成分镜</button></div></aside><section class="panel"><div class="panel-heading"><h2>02 镜头规划与历史</h2><button id="refreshBoardJobs">刷新历史</button></div><div class="production-toolbar"><div class="two"><label>分镜生成历史<select id="boardJobs"><option value="">选择生成任务</option></select></label><label>已保存分镜<select id="drafts"><option value="">选择草稿</option></select></label></div><details class="recovery-tools"><summary>恢复已保存输出</summary><button id="recoverBoard">重新校验已保存输出</button></details><p id="boardState" class="muted">生成后可编辑逐秒动作、对白和镜头衔接。保存新版本不会修改历史视频输入。</p></div><div id="shots" class="empty panel-scroll">先载入剧本并选择参考图片。</div><div class="editor-footer actions"><button id="saveDraft">保存分镜版本</button><button id="toVideo" class="primary">确认并进入视频制作</button></div></section></main><div id="status" class="status" role="status">准备就绪</div><dialog id="dialog"><div class="row"><h2 id="dialogTitle"></h2><button id="closeDialog">关闭</button></div><div id="dialogBody"></div></dialog><script src="/static/request-utils.js?v=20261030-layout2"></script><script src="/static/production.js?v=20261030-layout2"></script></body></html>
